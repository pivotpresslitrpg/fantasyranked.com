name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 9am UTC (new releases)
    - cron: '0 9 * * *'
    # Sunday at 8am UTC (weekly rankings rebuild)
    - cron: '0 8 * * 0'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify feed connectivity
        env:
          BLOG_FEED_API_KEY: ${{ secrets.BLOG_FEED_API_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Blog-Feed-Key: $BLOG_FEED_API_KEY" 'https://api.litrpgtools.com/api/blog-feed/books?limit=2&sort=top_rated')
          echo "feed status: $status"
          if [ "$status" != "200" ]; then
            echo "Blog feed unreachable from runner (status $status) — failing instead of deploying an empty site."
            exit 1
          fi

      - name: Build
        env:
          BLOG_FEED_API_KEY: ${{ secrets.BLOG_FEED_API_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=fantasyranked --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify newest article on the custom domain
        run: |
          CHANGED_FILE=$(git diff --diff-filter=AM --name-only HEAD^ HEAD -- 'src/content/posts/20*.md' | head -1)
          LATEST_FILE=${CHANGED_FILE:-$(find src/content/posts -maxdepth 1 -type f -name '20*.md' | sort | tail -1)}
          test -n "$LATEST_FILE"
          SLUG=$(basename "$LATEST_FILE" .md)
          LATEST_ARTICLE_URL="https://fantasyranked.com/blog/${SLUG}/"
          curl --retry 12 --retry-delay 5 --retry-all-errors --fail --silent --show-error "$LATEST_ARTICLE_URL" -o /dev/null
          echo "LATEST_ARTICLE_URL=$LATEST_ARTICLE_URL" >> "$GITHUB_ENV"

      - name: Notify IndexNow
        if: success()
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"fantasyranked.com\",\"key\":\"fr4a9c1d6e3b8f2h\",\"urlList\":[\"https://fantasyranked.com/\",\"https://fantasyranked.com/rankings/\",\"https://fantasyranked.com/new-releases/\",\"https://fantasyranked.com/blog/\",\"$LATEST_ARTICLE_URL\",\"https://fantasyranked.com/sitemap-index.xml\"]}" || true
